[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learning-idk"
version = "3.0.0"
description = "Learning When to Say 'I Don't Know' — per-class reject-option thresholds for neural classifiers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Nicholas Kashani Motlagh", email = "kashanimotlagh.1@osu.edu" },
    { name = "Jim Davis" },
    { name = "Tim Anderson" },
    { name = "Jeremy Gwinnup" },
]
keywords = ["reject-option", "classification", "calibration", "temperature-scaling", "uncertainty"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch",
    "numpy",
    "scipy",
    "statsmodels",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[project.urls]
Paper = "https://arxiv.org/abs/2209.04944"
Repository = "https://github.com/osu-cvl/learning-idk"

[project.scripts]
learning-idk = "learning_idk.threshold:_cli"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
